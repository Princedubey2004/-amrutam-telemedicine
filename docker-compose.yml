version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amrutam-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amrutam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amrutam_password}
      POSTGRES_DB: ${POSTGRES_DB:-amrutam_telemedicine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amrutam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amrutam_user} -d ${POSTGRES_DB:-amrutam_telemedicine}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amrutam_pgdata:
    driver: local
